name: qrph_data_generator
description: EMVCo / QR Ph payload (data string) generator for Philippine e-wallets and banks (GCash, BDO, BPI, plus BIC-derived Maya, Metrobank, LandBank, UnionBank, RCBC, Chinabank, Security Bank, PNB, CIMB, Tonik, GoTyme, UNO — UNTESTED, see README). Pure-Dart CRC-16/CCITT-FALSE implementation.
version: 0.1.0
homepage: https://github.com/jj-automation-solution/qrph_data_generator
repository: https://github.com/jj-automation-solution/qrph_data_generator
issue_tracker: https://github.com/jj-automation-solution/qrph_data_generator/issues

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
